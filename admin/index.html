<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#0e2b26">
<title>Cornerwood Stud, Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
  :root{
    --cw-green:#0e2b26; --cw-green-light:#153f37;
    --gold:#b8a562; --gold-dark:#8f7d46;
    --bg:#f3f2f2; --text:#201e1d; --divider:#d8d5d0;
    --danger:#a33b3b;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{ margin:0; font-family:'Archivo', system-ui, sans-serif; background:var(--bg); color:var(--text); }
  h1,h2,h3{ font-family:'Oswald', sans-serif; font-weight:500; margin:0; }
  .wrap{ max-width:1000px; margin:0 auto; padding:0 20px; }

  /* --- gate --- */
  #gate{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; padding:32px 20px;
    background:radial-gradient(1100px 560px at 50% -8%, #1f4d43 0%, var(--cw-green) 62%); }
  .gate-logo{ width:min(240px,64vw); height:auto; display:block; }
  .gate-box{ background:#faf9f7; width:100%; max-width:400px; padding:34px 34px 30px; border-top:3px solid var(--gold); box-shadow:0 24px 60px rgba(0,0,0,.38), 0 2px 6px rgba(0,0,0,.2); }
  .gate-box h1{ font-size:26px; margin:0 0 4px; color:var(--cw-green); letter-spacing:.01em; }
  .gate-box .gate-sub{ font-size:13.5px; color:#6b6764; margin:0 0 24px; }
  .gate-field{ margin-bottom:16px; }
  .gate-field label{ display:block; font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:#6b6764; margin-bottom:6px; }
  .gate-input{ position:relative; }
  .gate-input input{ width:100%; padding:12px 14px; font-size:15px; font-family:inherit; color:var(--text); background:#fff; border:1px solid var(--divider); transition:border-color .15s ease, box-shadow .15s ease; }
  .gate-input input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(184,165,98,.28); }
  .gate-input input[type=password], .gate-input input.has-toggle{ padding-right:64px; }
  .gate-toggle{ position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:0; padding:6px 8px; font-family:inherit; font-size:11.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--gold-dark); cursor:pointer; }
  .gate-toggle:hover{ color:var(--cw-green); }
  .gate-error{ display:none; background:#fbeaea; border-left:3px solid var(--danger); color:var(--danger); font-size:13px; line-height:1.45; padding:10px 12px; margin:0 0 16px; }
  .gate-box button.gate-submit{ width:100%; padding:13px 14px; background:var(--cw-green); color:var(--gold); border:0; font-family:'Oswald',sans-serif; font-weight:500; font-size:15px; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; transition:background .15s ease, color .15s ease; }
  .gate-box button.gate-submit:hover:not(:disabled){ background:var(--gold); color:var(--cw-green); }
  .gate-box button.gate-submit:disabled{ opacity:.6; cursor:not-allowed; }
  .gate-foot{ text-align:center; font-size:12.5px; color:rgba(255,255,255,.62); line-height:1.7; }
  .gate-foot a{ color:var(--gold); text-decoration:none; }
  .gate-foot a:hover{ text-decoration:underline; }

  /* --- dashboard --- */
  #dashboard{ display:none; }
  header.top{ background:var(--cw-green); border-bottom:3px solid var(--gold); padding:18px 0; }
  header.top .wrap{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  header.top h1{ color:#fff; font-size:20px; }
  header.top .sub{ color:var(--gold); font-size:12px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; display:block; margin-bottom:2px; }
  header.top a.logout{ color:#fff; font-size:13px; text-decoration:underline; cursor:pointer; }

  main{ padding:32px 0 80px; }
  .panel{ background:#fff; border:1px solid var(--divider); margin-bottom:28px; }
  .panel-head{ padding:16px 20px; border-bottom:1px solid var(--divider); display:flex; align-items:center; justify-content:space-between; }
  .panel-head h2{ font-size:18px; }
  .btn{ display:inline-flex; align-items:center; gap:6px; padding:10px 18px; font-family:'Oswald',sans-serif; font-weight:500; font-size:13px; letter-spacing:.03em; text-transform:uppercase; cursor:pointer; border:0; }
  .btn-primary{ background:var(--gold); color:var(--cw-green); }
  .btn-primary:hover{ background:var(--gold-dark); color:#fff; }
  .btn-ghost{ background:transparent; border:1px solid var(--divider); color:var(--text); }
  .btn-ghost:hover{ background:#f0efec; }
  .btn-danger{ background:transparent; color:var(--danger); border:1px solid var(--danger); }
  .btn-danger:hover{ background:var(--danger); color:#fff; }
  .btn-small{ padding:6px 12px; font-size:11px; }

  table{ width:100%; border-collapse:collapse; }
  th{ text-align:left; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#8a8683; padding:10px 20px; border-bottom:1px solid var(--divider); }
  td{ padding:12px 20px; border-bottom:1px solid var(--divider); font-size:14px; vertical-align:middle; }
  tr:last-child td{ border-bottom:0; }
  .thumb{ width:48px; height:48px; object-fit:cover; background:#eee; display:block; }
  .badge{ display:inline-block; padding:3px 9px; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
  .badge-sold{ background:color-mix(in srgb, var(--danger) 15%, transparent); color:var(--danger); }
  .badge-available{ background:color-mix(in srgb, #2f7d4f 15%, transparent); color:#2f7d4f; }
  .row-actions{ display:flex; gap:8px; }
  .empty{ padding:40px 20px; text-align:center; color:#8a8683; font-size:14px; }

  /* --- form --- */
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:20px; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field.span-2{ grid-column:1/-1; }
  .field label{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:#6b6764; }
  .field input[type=text], .field textarea{ padding:9px 11px; font-size:14px; border:1px solid var(--divider); font-family:inherit; }
  .field input:focus, .field textarea:focus{ outline:2px solid var(--gold); outline-offset:0; border-color:var(--gold); }
  .field textarea{ resize:vertical; min-height:70px; }
  .field.checkbox{ flex-direction:row; align-items:center; gap:8px; }
  .field.checkbox label{ font-size:14px; text-transform:none; font-weight:600; color:var(--text); }
  .form-actions{ display:flex; gap:10px; padding:16px 20px; border-top:1px solid var(--divider); }
  .status{ font-size:13px; padding:10px 20px; display:none; }
  .status.ok{ display:block; background:#eaf5ee; color:#2f7d4f; }
  .status.err{ display:block; background:#fbeaea; color:var(--danger); }
  .hint{ font-size:12px; color:#8a8683; margin:0; padding:0 20px 16px; }

  /* --- gallery manager --- */
  .gallery{ display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:10px; margin-bottom:10px; }
  .gallery-item{ position:relative; aspect-ratio:1; background:#eee; cursor:grab; border:1px solid var(--divider); }
  .gallery-item:active{ cursor:grabbing; }
  .gallery-item img{ width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
  .gallery-item .cover-badge{ position:absolute; bottom:0; left:0; right:0; background:rgba(14,43,38,.85); color:var(--gold); font-size:9px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; text-align:center; padding:3px 0; }
  .gallery-item .remove-btn{ position:absolute; top:3px; right:3px; width:20px; height:20px; border:0; border-radius:50%; background:rgba(163,59,59,.9); color:#fff; font-size:13px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  .gallery-item .remove-btn:hover{ background:var(--danger); }
  .gallery-item.uploading{ display:flex; align-items:center; justify-content:center; font-size:10px; color:#8a8683; text-align:center; padding:4px; }
  .gallery-drop{ border:2px dashed var(--divider); padding:18px; text-align:center; font-size:13px; color:#8a8683; cursor:pointer; transition:border-color .15s ease, background .15s ease; }
  .gallery-drop:hover, .gallery-drop.drag-over{ border-color:var(--gold); background:#faf8f1; color:var(--text); }
  .gallery-drop input{ display:none; }

  /* --- phones & small tablets --- */
  html{ -webkit-text-size-adjust:100%; }
  @media (max-width:640px){
    main{ padding:20px 0 60px; }
    .wrap{ padding:0 14px; }
    .form-grid{ grid-template-columns:1fr; padding:16px; }
    .field input[type=text], .field textarea, .gate-input input{ font-size:16px; padding:11px 12px; }
    .field.checkbox input{ width:22px; height:22px; }
    .form-actions{ padding:14px 16px; }
    .form-actions .btn{ flex:1; justify-content:center; min-height:46px; }
    .panel-head{ padding:14px 16px; }
    .hint{ padding:0 16px 14px; }
    .btn-small{ padding:9px 12px; font-size:12px; }
    header.top a.logout{ display:inline-flex; align-items:center; min-height:44px; }
    .gate-box{ padding:28px 20px 24px; }
    .gallery{ grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); }
    .gallery-item .remove-btn{ width:28px; height:28px; font-size:16px; }
    /* horse list as stacked cards */
    #tableWrap table, #tableWrap tbody, #tableWrap tr, #tableWrap td{ display:block; width:100%; }
    #tableWrap thead{ display:none; }
    #tableWrap tr{ position:relative; padding:14px 16px 14px 80px; min-height:92px; border-bottom:1px solid var(--divider); }
    #tableWrap tr:last-child{ border-bottom:0; }
    #tableWrap td{ padding:2px 0; border:0; font-size:14px; }
    #tableWrap td:first-child{ position:absolute; left:16px; top:16px; width:auto; padding:0; }
    #tableWrap .thumb{ width:52px; height:52px; }
    #tableWrap td:nth-child(3):not(:empty)::before{ content:"Age: "; color:#8a8683; }
    #tableWrap td:nth-child(4):not(:empty)::before{ content:"Price: "; color:#8a8683; }
    #tableWrap td:nth-child(5){ margin-top:4px; }
    #tableWrap .row-actions{ flex-wrap:wrap; margin-top:8px; }
    #tableWrap .row-actions .btn{ min-height:40px; }
  }
</style>
</head>
<body>

<div id="gate">
  <img class="gate-logo" src="/assets/cornerwood-logo.svg" alt="Cornerwood Stud &amp; Sport Horses">
  <form class="gate-box" id="gateForm" novalidate>
    <h1>Admin sign in</h1>
    <p class="gate-sub">Sign in to manage horses for sale.</p>
    <div class="gate-field">
      <label for="gateEmail">Email</label>
      <div class="gate-input"><input type="email" id="gateEmail" autocomplete="username" required autofocus></div>
    </div>
    <div class="gate-field">
      <label for="gatePassword">Password</label>
      <div class="gate-input">
        <input type="password" id="gatePassword" autocomplete="current-password" required>
        <button type="button" class="gate-toggle" id="gateToggle" aria-label="Show password">Show</button>
      </div>
    </div>
    <div class="gate-error" id="gateError" role="alert"></div>
    <button type="submit" class="gate-submit" id="gateBtn">Sign in</button>
  </form>
  <div class="gate-foot">
    Authorised staff only<br>
    <a href="/">&larr; Back to website</a>
  </div>
</div>

<div id="dashboard">
  <header class="top">
    <div class="wrap">
      <div>
        <span class="sub">Cornerwood Stud</span>
        <h1>Horses for sale, admin</h1>
      </div>
      <a class="logout" id="logoutBtn">Log out</a>
    </div>
  </header>

  <main class="wrap">
    <div class="panel">
      <div class="panel-head">
        <h2 id="formTitle">Add a horse</h2>
        <button type="button" class="btn btn-ghost btn-small" id="cancelEditBtn" style="display:none;">Cancel edit</button>
      </div>
      <div class="status" id="formStatus"></div>
      <form id="horseForm">
        <div class="form-grid">
          <div class="field span-2">
            <label for="f-name">Name *</label>
            <input type="text" id="f-name" required>
          </div>
          <div class="field">
            <label for="f-age">Age / year born</label>
            <input type="text" id="f-age" placeholder="e.g. 2019">
          </div>
          <div class="field">
            <label for="f-breed">Breed</label>
            <input type="text" id="f-breed" placeholder="e.g. Irish Sport Horse">
          </div>
          <div class="field">
            <label for="f-sex">Sex</label>
            <input type="text" id="f-sex" placeholder="e.g. Gelding">
          </div>
          <div class="field">
            <label for="f-height">Height</label>
            <input type="text" id="f-height" placeholder="e.g. 16">
          </div>
          <div class="field span-2">
            <label for="f-categories">Categories</label>
            <input type="text" id="f-categories" placeholder="e.g. Allrounder // Riding Club // Hacking">
          </div>
          <div class="field">
            <label for="f-price">Price</label>
            <input type="text" id="f-price" placeholder="e.g. POA or £12,500">
          </div>
          <div class="field checkbox" style="align-self:end;">
            <input type="checkbox" id="f-sold">
            <label for="f-sold">Sold</label>
          </div>
          <div class="field span-2">
            <label>Photos</label>
            <div class="gallery" id="gallery"></div>
            <label class="gallery-drop" id="galleryDrop" for="f-photo-input">
              Drag &amp; drop photos here, or click to choose files, first photo is the cover. Drag thumbnails to reorder.
              <input type="file" id="f-photo-input" accept="image/*" multiple>
            </label>
          </div>
          <div class="field span-2">
            <label for="f-description">Description (optional, shown under specs)</label>
            <textarea id="f-description" style="min-height:140px;"></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">Add horse</button>
        </div>
      </form>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Current horses</h2>
      </div>
      <div id="tableWrap">
        <div class="empty">Loading…</div>
      </div>
    </div>
  </main>
</div>

<script>
(function(){
  var SUPABASE_URL = 'https://jioacvzzweugnacuzoyo.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_AP2frH528wRVmUIq_hSgLw_f7aq5oRf';

  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  var editingId = null;
  var currentPhotos = [];
  var uploadFolderId = (crypto.randomUUID ? crypto.randomUUID() : 'tmp-' + Date.now());
  var gallerySortable = null;

  var gate = document.getElementById('gate');
  var dashboard = document.getElementById('dashboard');
  var gateForm = document.getElementById('gateForm');
  var gateError = document.getElementById('gateError');

  function unlock(){
    gate.style.display = 'none';
    dashboard.style.display = 'block';
    loadHorses();
  }

  function lock(){
    dashboard.style.display = 'none';
    gate.style.display = 'flex';
  }

  sb.auth.getSession().then(function(res){
    if (res.data && res.data.session) unlock();
  });

  sb.auth.onAuthStateChange(function(event, session){
    if (event === 'SIGNED_OUT') lock();
  });

  var FAIL_KEY = 'cw_admin_fails';
  var gateBtn = document.getElementById('gateBtn');
  var lockTimer = null;

  function readFails(){
    try { return JSON.parse(localStorage.getItem(FAIL_KEY)) || { n: 0, until: 0 }; }
    catch (e) { return { n: 0, until: 0 }; }
  }
  function writeFails(f){
    try { localStorage.setItem(FAIL_KEY, JSON.stringify(f)); } catch (e) {}
  }
  function showGateError(msg){
    gateError.textContent = msg;
    gateError.style.display = msg ? 'block' : 'none';
  }
  function tickLock(){
    var f = readFails();
    var left = Math.ceil((f.until - Date.now()) / 1000);
    if (left > 0) {
      gateBtn.disabled = true;
      gateBtn.textContent = 'Try again in ' + left + 's';
      showGateError('Too many failed attempts. Please wait before trying again.');
      lockTimer = setTimeout(tickLock, 500);
    } else {
      gateBtn.disabled = false;
      gateBtn.textContent = 'Sign in';
      if (f.until) { showGateError(''); writeFails({ n: f.n, until: 0 }); }
    }
  }
  tickLock();

  document.getElementById('gateToggle').addEventListener('click', function(){
    var pw = document.getElementById('gatePassword');
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    this.textContent = show ? 'Hide' : 'Show';
    this.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  gateForm.addEventListener('submit', function(e){
    e.preventDefault();
    var f = readFails();
    if (f.until > Date.now()) return;
    var email = document.getElementById('gateEmail').value.trim();
    var password = document.getElementById('gatePassword').value;
    if (!email || !password) { showGateError('Please enter your email and password.'); return; }
    gateBtn.disabled = true;
    gateBtn.textContent = 'Signing in\u2026';
    showGateError('');
    sb.auth.signInWithPassword({ email: email, password: password }).then(function(res){
      document.getElementById('gatePassword').value = '';
      if (res.error || !res.data.session) {
        var n = f.n + 1;
        // 5 free tries, then 30s, 60s, 120s ... capped at 15 min
        var wait = n >= 5 ? Math.min(900, 30 * Math.pow(2, n - 5)) : 0;
        writeFails({ n: n, until: wait ? Date.now() + wait * 1000 : 0 });
        var rateLimited = res.error && (res.error.status === 429 || /rate limit/i.test(res.error.message || ''));
        showGateError(rateLimited ? 'Too many attempts. Please wait a few minutes and try again.' : 'Incorrect email or password.');
        gateBtn.disabled = false;
        gateBtn.textContent = 'Sign in';
        if (wait) tickLock();
        return;
      }
      writeFails({ n: 0, until: 0 });
      showGateError('');
      gateBtn.disabled = false;
      gateBtn.textContent = 'Sign in';
      unlock();
    });
  });

  document.getElementById('logoutBtn').addEventListener('click', function(){
    sb.auth.signOut();
  });

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function renderGallery(){
    var el = document.getElementById('gallery');
    el.innerHTML = currentPhotos.map(function(url, i){
      return '<div class="gallery-item" data-url="' + esc(url) + '">' +
        '<img src="' + esc(url) + '" alt="">' +
        (i === 0 ? '<div class="cover-badge">Cover</div>' : '') +
        '<button type="button" class="remove-btn" data-remove="' + i + '" title="Remove">&times;</button>' +
        '</div>';
    }).join('');
    el.querySelectorAll('[data-remove]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.preventDefault();
        currentPhotos.splice(parseInt(btn.getAttribute('data-remove'), 10), 1);
        renderGallery();
      });
    });
    if (!gallerySortable) {
      gallerySortable = new Sortable(el, {
        animation: 150,
        onEnd: function(evt){
          var moved = currentPhotos.splice(evt.oldIndex, 1)[0];
          currentPhotos.splice(evt.newIndex, 0, moved);
          renderGallery();
        }
      });
    }
  }

  function addUploadingTile(){
    var el = document.getElementById('gallery');
    var tile = document.createElement('div');
    tile.className = 'gallery-item uploading';
    tile.textContent = 'Uploading…';
    el.appendChild(tile);
    return tile;
  }

  function uploadFiles(fileList){
    var files = [...fileList].filter(function(f){ return f.type.indexOf('image/') === 0; });
    files.forEach(function(file){
      var tile = addUploadingTile();
      var ext = (file.name.match(/\.\w+$/) || ['.jpg'])[0];
      var path = 'horses/' + uploadFolderId + '/admin-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + ext;
      sb.storage.from('horse-photos').upload(path, file, { upsert: true, contentType: file.type })
        .then(function(res){
          tile.remove();
          if (res.error) {
            showStatus('Upload failed: ' + res.error.message, false);
            return;
          }
          var pub = sb.storage.from('horse-photos').getPublicUrl(path);
          currentPhotos.push(pub.data.publicUrl);
          renderGallery();
        });
    });
  }

  var galleryDrop = document.getElementById('galleryDrop');
  var galleryInput = document.getElementById('f-photo-input');
  galleryInput.addEventListener('change', function(){
    uploadFiles(galleryInput.files);
    galleryInput.value = '';
  });
  ['dragover','dragenter'].forEach(function(evt){
    galleryDrop.addEventListener(evt, function(e){ e.preventDefault(); galleryDrop.classList.add('drag-over'); });
  });
  ['dragleave','dragend','drop'].forEach(function(evt){
    galleryDrop.addEventListener(evt, function(e){ galleryDrop.classList.remove('drag-over'); });
  });
  galleryDrop.addEventListener('drop', function(e){
    e.preventDefault();
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
      uploadFiles(e.dataTransfer.files);
    }
  });

  renderGallery();

  function showStatus(msg, ok){
    var el = document.getElementById('formStatus');
    el.textContent = msg;
    el.className = 'status ' + (ok ? 'ok' : 'err');
    setTimeout(function(){ el.className = 'status'; }, 4000);
  }

  function resetForm(){
    editingId = null;
    document.getElementById('horseForm').reset();
    document.getElementById('formTitle').textContent = 'Add a horse';
    document.getElementById('submitBtn').textContent = 'Add horse';
    document.getElementById('cancelEditBtn').style.display = 'none';
    currentPhotos = [];
    uploadFolderId = (crypto.randomUUID ? crypto.randomUUID() : 'tmp-' + Date.now());
    renderGallery();
  }

  document.getElementById('cancelEditBtn').addEventListener('click', resetForm);

  function fillForm(h){
    editingId = h.id;
    document.getElementById('f-name').value = h.name || '';
    document.getElementById('f-age').value = h.age || '';
    document.getElementById('f-breed').value = h.breed || '';
    document.getElementById('f-sex').value = h.sex || '';
    document.getElementById('f-height').value = h.height || '';
    document.getElementById('f-categories').value = h.categories || '';
    document.getElementById('f-price').value = h.price || '';
    document.getElementById('f-sold').checked = !!h.sold;
    document.getElementById('f-description').value = h.description || '';
    document.getElementById('formTitle').textContent = 'Edit ' + h.name;
    document.getElementById('submitBtn').textContent = 'Save changes';
    document.getElementById('cancelEditBtn').style.display = 'inline-flex';
    currentPhotos = (h.photos && h.photos.length) ? h.photos.slice() : (h.photo ? [h.photo] : []);
    uploadFolderId = h.id;
    renderGallery();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.getElementById('horseForm').addEventListener('submit', function(e){
    e.preventDefault();
    var payload = {
      name: document.getElementById('f-name').value.trim(),
      age: document.getElementById('f-age').value.trim() || null,
      breed: document.getElementById('f-breed').value.trim() || null,
      sex: document.getElementById('f-sex').value.trim() || null,
      height: document.getElementById('f-height').value.trim() || null,
      categories: document.getElementById('f-categories').value.trim() || null,
      price: document.getElementById('f-price').value.trim() || null,
      sold: document.getElementById('f-sold').checked,
      photo: currentPhotos[0] || null,
      photos: currentPhotos,
      description: document.getElementById('f-description').value.trim() || null
    };
    if (!payload.name) return;

    var req = editingId
      ? sb.from('horses').update(payload).eq('id', editingId)
      : sb.from('horses').insert(payload);

    req.then(function(res){
      if (res.error) {
        showStatus('Error: ' + res.error.message, false);
        return;
      }
      showStatus(editingId ? 'Horse updated.' : 'Horse added.', true);
      resetForm();
      loadHorses();
    });
  });

  function deleteHorse(id, name){
    if (!confirm('Delete ' + name + '? This can\'t be undone.')) return;
    sb.from('horses').delete().eq('id', id).then(function(res){
      if (res.error) {
        showStatus('Error: ' + res.error.message, false);
        return;
      }
      loadHorses();
    });
  }

  function toggleSold(h){
    sb.from('horses').update({ sold: !h.sold }).eq('id', h.id).then(function(res){
      if (res.error) {
        showStatus('Error: ' + res.error.message, false);
        return;
      }
      loadHorses();
    });
  }

  function loadHorses(){
    sb.from('horses').select('*').order('sort_order', { ascending: true }).order('created_at', { ascending: true })
      .then(function(res){
        var wrap = document.getElementById('tableWrap');
        if (res.error) {
          wrap.innerHTML = '<div class="empty">Error loading horses: ' + esc(res.error.message) + '</div>';
          return;
        }
        var horses = res.data || [];
        if (!horses.length) {
          wrap.innerHTML = '<div class="empty">No horses yet, add one above.</div>';
          return;
        }
        var rows = horses.map(function(h){
          return '<tr>' +
            '<td>' + (h.photo ? '<img class="thumb" src="' + esc(h.photo) + '" alt="">' : '<div class="thumb"></div>') + '</td>' +
            '<td><strong>' + esc(h.name) + '</strong><br><span style="color:#8a8683;font-size:12px;">' + esc(h.breed || '') + '</span></td>' +
            '<td>' + esc(h.age || '') + '</td>' +
            '<td>' + esc(h.price || '') + '</td>' +
            '<td><span class="badge ' + (h.sold ? 'badge-sold' : 'badge-available') + '" style="cursor:pointer;" data-toggle="' + h.id + '">' + (h.sold ? 'Sold' : 'Available') + '</span></td>' +
            '<td><div class="row-actions">' +
              '<button type="button" class="btn btn-ghost btn-small" data-edit="' + h.id + '">Edit</button>' +
              '<button type="button" class="btn btn-danger btn-small" data-delete="' + h.id + '" data-name="' + esc(h.name) + '">Delete</button>' +
            '</div></td>' +
          '</tr>';
        }).join('');
        wrap.innerHTML =
          '<table><thead><tr>' +
            '<th></th><th>Name / Breed</th><th>Age</th><th>Price</th><th>Status</th><th>Actions</th>' +
          '</tr></thead><tbody>' + rows + '</tbody></table>';

        wrap.querySelectorAll('[data-edit]').forEach(function(btn){
          btn.addEventListener('click', function(){
            var h = horses.find(function(x){ return x.id === btn.getAttribute('data-edit'); });
            if (h) fillForm(h);
          });
        });
        wrap.querySelectorAll('[data-delete]').forEach(function(btn){
          btn.addEventListener('click', function(){
            deleteHorse(btn.getAttribute('data-delete'), btn.getAttribute('data-name'));
          });
        });
        wrap.querySelectorAll('[data-toggle]').forEach(function(badge){
          badge.addEventListener('click', function(){
            var h = horses.find(function(x){ return x.id === badge.getAttribute('data-toggle'); });
            if (h) toggleSold(h);
          });
        });
      });
  }
})();
</script>
</body>
</html>
